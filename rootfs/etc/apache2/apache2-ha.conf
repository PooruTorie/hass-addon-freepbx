# Minimal Apache main config for HA add-on container (single source of truth)
# Ensures Debian-style module loading works (fixes: AH00534 No MPM loaded)

ServerRoot "/etc/apache2"

# Runtime defaults (container-safe)
DefaultRuntimeDir "/var/run/apache2"
PidFile "/var/run/apache2/apache2.pid"

# Logging: error -> stderr, access -> stdout
ErrorLog "/proc/self/fd/2"
LogLevel warn

# (Access logging is enforced in the HA single vhost to avoid vhost overrides.)
# Extra safety: simplified access log (helps diagnose if format/format-name is overwritten somewhere)
LogFormat "[HA-ACCESS-COMMON] %h %l %u %t \"%r\" %>s %b" ha_common
CustomLog "/proc/self/fd/1" ha_common
CustomLog "/proc/self/fd/2" ha_common

Listen 80

# Suppress "Could not reliably determine the server's fully qualified domain name"
ServerName localhost

User "www-data"
Group "www-data"

# Modules + configs
IncludeOptional /etc/apache2/mods-enabled/*.load
IncludeOptional /etc/apache2/mods-enabled/*.conf
IncludeOptional /etc/apache2/conf-enabled/*.conf

# Always include HA log routing + PHP error routing even if conf-enabled isn't populated
IncludeOptional /etc/apache2/conf-available/zzz-ha-logs.conf
IncludeOptional /etc/apache2/conf-available/zzz-ha-php-errors.conf
# Force logging to stdout/stderr even if some vhost tries to override
IncludeOptional /etc/apache2/conf-available/zzz-ha-force-vhost-logs.conf

# Identify this container in responses (helps debug upstream/proxy confusion)
Header set X-HA-FreePBX-Apache "1"

# Virtual hosts
IncludeOptional /etc/apache2/sites-enabled/*.conf
