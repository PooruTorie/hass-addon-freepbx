# Force vhost-level logging to stdout/stderr.
# Some Debian/FreePBX vhosts set their own ErrorLog/CustomLog (often to files).
# This captures *all* vhosts via the global server config by setting defaults
# and can be combined with vhost patches if needed.

# Ensure global defaults (should already be set by apache2-ha.conf)
ErrorLog "/proc/self/fd/2"

# Use the same format as zzz-ha-logs.conf
LogFormat "[HA-ACCESS] %h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-agent}i\"" ha_combined
CustomLog "/proc/self/fd/1" ha_combined

