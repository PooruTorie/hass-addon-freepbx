# Log routing for HA add-on container
# - ErrorLog -> stderr so it shows in s6 logs
# - AccessLog is configured in apache2-ha.conf (single source of truth)

ErrorLog "/proc/self/fd/2"
LogLevel info

# More context for errors (still safe): include client + request id if available
ErrorLogFormat "[HA-APACHE %t] [%l] [pid %P:tid %T] [client %a] %M"
