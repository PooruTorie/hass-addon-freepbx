# PHP error logging for HA add-on container
# Goal: Make PHP fatals visible in s6 logs (stderr), especially for HTTP 500 debugging.
# This targets mod_php (libapache2-mod-php8.2 in the image).

<IfModule mod_php.c>
    php_admin_flag log_errors On
    # Let PHP ini decide error_log (we set it to /data/php-error.log via conf.d)

    # Reasonable default reporting. (FreePBX may override some settings.)
    php_admin_value error_reporting "E_ALL"
    php_admin_flag display_errors Off
</IfModule>

# Debian sometimes names the module differently (libphp8.2).
<IfModule mod_php8.c>
    php_admin_flag log_errors On
    # Let PHP ini decide error_log (we set it to /data/php-error.log via conf.d)
    php_admin_value error_reporting "E_ALL"
    php_admin_flag display_errors Off
</IfModule>
