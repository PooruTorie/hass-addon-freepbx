# Single vhost for HA add-on logging/debugging
# This vhost is intended to be the only enabled site in the container.

<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html

    DirectoryIndex index.php index.html

    <Directory /var/www/html>
        AllowOverride All
        Require all granted
    </Directory>

    # Force logs to s6 console (stderr)
    ErrorLog /proc/self/fd/2
    LogLevel info

    LogFormat "[HA-ACCESS] %h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-agent}i\"" ha_combined
    CustomLog /proc/self/fd/2 ha_combined

    # PHP errors -> stderr (mod_php)
    <IfModule mod_php.c>
        php_admin_flag log_errors On
        # Let PHP ini decide error_log (we set it to /data/php-error.log via conf.d)
        php_admin_value error_reporting "E_ALL"

        # Default: do not expose errors to clients, log only
        php_admin_flag display_errors Off
        php_admin_flag display_startup_errors On

        # Optional debug: set via env HA_PHP_DEBUG=1 in the container to also show errors in responses
        <If "%{ENV:HA_PHP_DEBUG} == '1'">
            php_admin_flag display_errors On
        </If>
    </IfModule>

    # Ensure .php is handled by mod_php in this single-vhost setup
    <FilesMatch \.php$>
        SetHandler application/x-httpd-php
    </FilesMatch>

    # Optional debug toggles (read by <If> expressions below)
    # Enable in add-on config via environment variables.
    SetEnvIfExpr "-n %{ENV:HA_PHP_DEBUG}" HA_PHP_DEBUG=%{ENV:HA_PHP_DEBUG}
    SetEnvIfExpr "-n %{ENV:HA_APACHE_DEBUG}" HA_APACHE_DEBUG=%{ENV:HA_APACHE_DEBUG}

    # Increase Apache error verbosity for this vhost when debugging.
    <If "%{ENV:HA_APACHE_DEBUG} == '1'">
        LogLevel debug
    </If>
</VirtualHost>
